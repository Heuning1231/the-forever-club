h1{color:#51405d;text-shadow:0 2px 0 #fff9,0 0 28px #fff}small{color:#735428;font-weight:600}.star span{color:#51405d;text-shadow:0 1px 6px #fff}.star svg{filter:drop-shadow(0 2px 3px #a58355) drop-shadow(0 0 18px #fff)}@keyframes glow{to{transform:scale(1.12);filter:drop-shadow(0 2px 5px #b2915b) drop-shadow(0 0 26px #fff)}}.portal{color:#51405d;text-shadow:0 1px 2px #fff;background:radial-gradient(ellipse,#fff9,transparent 75%)}.portal:hover{background:radial-gradient(ellipse,#fff,transparent 75%)}.action{color:#51405d;background:linear-gradient(110deg,#ebd5aa,#fff2d7 43%,#d9be8b);box-shadow:0 8px 24px #83624128,inset 0 1px #fff;border-color:#b69765;min-height:44px}.action:hover{background:#fff2d7}.paper{background:linear-gradient(145deg,#fffaf1,#f4e8f4 53%,#e6d6ef);box-shadow:0 18px 40px #51405d24,0 2px 4px #51405d20,inset 0 1px #fff9}.photo{background:linear-gradient(160deg,#fbf7f0,#eae0d2);box-shadow:0 12px 25px #51366355}.placeholder{background:linear-gradient(145deg,#f8f3eb,#cdb7df)}main:before{border-color:#b5936077}main:after{border-color:#b5936033}dialog{background:#f8f3eb;color:#51405d}button{touch-action:manipulation}main>*{animation:arrival .55s cubic-bezier(.22,1,.36,1) both}@keyframes arrival{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}</style><canvas id="sky"></canvas><main id="app"></main><dialog id="viewer"><div id="media"></div><button class="action" onclick="viewer.close()">Close</button></dialog><script>
const app=document.querySelector('#app'),names=['KAHEAN','Líng Lëé','Jia Qi','yimin_04'];let who='',unlocked=false,q=0,page=0,items=Array.from({length:78},(_,i)=>({type:i<37?'photo':'video'}));const star='<svg viewBox="0 0 100 100"><path fill="#ffe2a5" d="M50 0Q58 40 100 50Q58 58 50 100Q42 58 0 50Q42 42 50 0Z"/><path fill="#fff9e8" d="M50 0L50 50 0 50Q42 42 50 0ZM50 50L100 50Q58 58 50 100Z"/></svg>';
function title(t,s='THE FOREVER CLUB · 2022–2026'){return '<small>'+s+'</small><h1>'+t+'</h1>'}function back(){return '<button class="action" onclick="home()">Return to the stars</button>'}function stars(final=false){return '<div class="stars"><svg viewBox="0 0 400 340" style="position:absolute;inset:0;width:100%;height:100%"><path d="M200 54L64 160L200 285L336 160Z" stroke="#e7c58b" stroke-width="'+(final?2:.6)+'" fill="none"/></svg>'+names.map((n,i)=>'<button class="star" style="left:'+ [50,16,84,50][i]+'%;top:'+ [16,47,47,84][i]+'%" '+(final||i===0?'disabled':'onclick="choose('+i+')"')+'>'+star+'<span>'+n+'</span></button>').join('')+'</div>'}
function start(){app.innerHTML=title('Four Girls. One Universe.')+stars()+'<p>Choose your star</p>'}function choose(i){who=names[i];unlocked=localStorage.getItem('fc-simple-'+who)==='yes';home()}function home(){app.innerHTML=title('A Universe of Us','WELCOME · '+who)+'<div class="menu"><button class="portal" onclick="memories()">Our Memories<small>EVERY LITTLE MOMENT</small></button><button class="portal" onclick="letter()">A Letter for You<small>ACROSS THE STARS</small></button><button class="portal" onclick="quiz(true)">Friendship Challenge<small>HOW WELL DO YOU KNOW US?</small></button>'+(unlocked?'<button class="portal" onclick="ending()">Est. Forever<small>A SECRET AMONG THE STARS</small></button>':'')+'</div><button class="action" onclick="start()">Choose another star</button>'}
function memories(){app.innerHTML=title('Our Memories')+'<div class="memory"><svg viewBox="0 0 400 420" style="position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 8px #ffd58e)"><path d="M-30 0C450 100 -80 160 250 220S430 340 0 420" stroke="#e9c88d" stroke-width="3" fill="none"/></svg>'+Array.from({length:3},(_,j)=>{let i=(page+j)%items.length,m=items[i],src=m.thumb||m.poster||(m.type!=='video'?m.src:'');return '<button class="photo" onclick="view('+i+')">'+(src?'<img src="'+src+'" loading="lazy">':'<div class="placeholder">Memory '+(i+1)+'</div>')+(m.type==='video'?'Play video':'')+'</button>'}).join('')+'</div><button class="action" onclick="page=(page+3)%items.length;memories()">More memories</button>'+back()}
function view(i){let m=items[i],d=document.querySelector('#media');d.replaceChildren();if(m.src){let el=document.createElement(m.type==='video'||/\.mp4$/i.test(m.src)?'video':'img');el.src=m.src;el.controls=true;d.append(el)}else d.textContent='Original media not yet available.';viewer.showModal()}viewer.onclose=()=>document.querySelector('#media').replaceChildren();
function letter(){app.innerHTML=title('Across the Stars')+'<article class="paper"><h2>Dear '+who+',</h2><p>没想到四年就这样过去了。以后我们可能不会每天见面，也不会每天一起上课、赶 assignment、讲八卦。</p><p>但希望不管过了多少年，我们还是可以坐在同一张 Mamak 桌子，聊着那些只有我们才懂的事情。</p><p>希望你们以后都很有钱、很漂亮、很幸福。毕业只是结束了我们的学生身份，不是结束了我们的友情。</p><p>With love,<br>KAHEAN</p></article>'+back()}
const questions=[['Which phrase appeared in our IG Notes?',['有被恶心到','毕业快乐','早安'],0],['What colour was the photo booth?',['Blue','Pink','Green'],1],['What was on the birthday glasses?',['Stars','Candles','Hearts'],1],['What were we doing in the street photo?',['Looking at phones','Running','Dancing'],0]];function quiz(reset){if(reset)q=0;if(q===questions.length){unlocked=true;localStorage.setItem('fc-simple-'+who,'yes');app.innerHTML=title('A secret awaits')+'<button onclick="ending()" style="width:140px">'+star+'</button><p>Touch the hidden star</p>'+back();return}let a=questions[q];app.innerHTML=title('Friendship Challenge')+'<div class="paper"><small style="color:#82678c">QUESTION '+(q+1)+' / 4</small><h2>'+a[0]+'</h2>'+a[1].map((x,i)=>'<button class="answer" onclick="answer('+i+')">'+x+'</button>').join('')+'<p id="feedback"></p></div>'+back()}function answer(i){let a=questions[q];document.querySelectorAll('.answer').forEach(b=>b.disabled=true);document.querySelector('#feedback').textContent=i===a[2]?'Correct!':'The answer is '+a[1][a[2]];let b=document.createElement('button');b.className='action';b.textContent='Continue';b.onclick=()=>{q++;quiz(false)};app.append(b)}function ending(){app.innerHTML=title('Est. Forever')+stars(true)+'<p>Of all the stars in the universe,<br>I’m glad our paths crossed.<br>Different dreams, different journeys,<br>but always under the same sky.</p><h2 style="font-weight:400">The Forever Club — Est. Forever.</h2>'+back()}
fetch('./media.json').then(r=>r.json()).then(m=>{let a=Array.isArray(m)?m:m.items||[...(m.photos||[]),...(m.videos||[])];if(a.length)items=a}).catch(()=>{});start();const c=document.querySelector('#sky'),ctx=c.getContext('2d');let w,h,pts=[],cloud;function resize(){w=c.width=innerWidth;h=c.height=innerHeight;cloud=document.createElement('canvas');cloud.width=w;cloud.height=h;const b=cloud.getContext('2d');b.fillStyle='#e9dff3';b.fillRect(0,0,w,h);for(let i=0;i<75;i++){let u=i/74,x=w*(.5+.36*Math.sin(u*8)),y=h*u,r=Math.max(w,h)*(.09+.12*Math.sin(i*2.3)**2),g=b.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,i%4===0?'#fffaf155':'#dbb7c455');g.addColorStop(1,'#b79bd400');b.fillStyle=g;b.fillRect(x-r,y-r,r*2,r*2)}pts=Array.from({length:250},()=>[Math.random()*w,Math.random()*h,Math.random()*1.5+.2,Math.random()*6])}resize();addEventListener('resize',resize);function draw(t){ctx.fillStyle='#e9dff3';ctx.fillRect(0,0,w,h);for(let i=0;i<12;i++){let x=w*(.5+.48*Math.sin(i*2.4)),y=h*(.5+.48*Math.cos(i*1.8)),g=ctx.createRadialGradient(x,y,0,x,y,Math.max(w,h)*.45);g.addColorStop(0,i%3===0?'#fffaf1aa':'#cdb7df88');g.addColorStop(1,'#b69bda00');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}ctx.globalAlpha=.72;ctx.drawImage(cloud,0,0);ctx.globalAlpha=1;for(let [x,y,r,p] of pts){ctx.globalAlpha=.35+.6*(.5+.5*Math.sin(t*.0008+p));ctx.fillStyle='#b59360';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();if(r>1.5){ctx.strokeStyle='#fffaf1';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(x-4,y);ctx.lineTo(x+4,y);ctx.moveTo(x,y-4);ctx.lineTo(x,y+4);ctx.stroke()}}ctx.globalAlpha=1;if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
