<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8F3EB">
  <title>The Forever Club — 2022–2026</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <link rel="stylesheet" href="./assets/css/universe.css">
</head>
<body>
  <canvas id="bg-stars" aria-hidden="true"></canvas>

  <header id="top-bar" class="top-bar is-hidden">
    <div class="top-bar-group">
      <button type="button" class="chrome-pill" id="btn-home">Universe</button>
      <span class="member-pill" id="nav-member-badge">Private Collection</span>
    </div>
    <details id="club-menu" class="club-menu">
      <summary>Menu <span aria-hidden="true"></span></summary>
      <div class="club-menu-panel">
        <button type="button" class="chrome-pill" id="btn-sound" aria-pressed="false">Sound On</button>
        <button type="button" class="chrome-pill" id="btn-motion" aria-pressed="false">Motion: Full</button>
        <button type="button" class="chrome-pill" id="btn-switch-member">Switch Star</button>
        <button type="button" class="chrome-pill" id="btn-replay-ticket">Ticket Desk</button>
      </div>
    </details>
  </header>

  <main id="app"></main>

  <dialog id="media-modal" class="media-modal hidden" aria-label="Memory viewer">
    <button type="button" class="modal-close-btn" id="modal-close" aria-label="Close viewer">Close</button>
    <div class="modal-stage" id="modal-stage"></div>
  </dialog>

  <aside id="egg-toast" class="egg-toast hidden" role="status" aria-live="polite">
    <span class="eyebrow" id="egg-count">Celestial Secret</span>
    <h3 id="egg-title"></h3>
    <p id="egg-body" class="muted"></p>
    <button type="button" class="btn-gold-outline hidden" id="egg-download">Save Certificate PNG</button>
    <button type="button" class="btn-gold-outline" id="egg-close">Acknowledge</button>
  </aside>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
