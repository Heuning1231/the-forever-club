function letter(){app.innerHTML=title('Across the Stars')+'<article class="paper"><h2>Dear '+who+',</h2><p>没想到四年就这样过去了。以后我们可能不会每天见面，也不会每天一起上课、赶 assignment、讲八卦。</p><p>但希望不管过了多少年，我们还是可以坐在同一张 Mamak 桌子，聊着那些只有我们才懂的事情。</p><p>希望你们以后都很有钱、很漂亮、很幸福。毕业只是结束了我们的学生身份，不是结束了我们的友情。</p><p>With love,<br>KAHEAN</p></article>'+back()}
const questions=[['Which phrase appeared in our IG Notes?',['有被恶心到','毕业快乐','早安'],0]];function quiz(){app.innerHTML=title('Friendship Challenge')+'<div class="flip-stage"><div id="flip-card" class="flip-card"><div class="flip-face paper"><small>OUR LITTLE SECRET</small><h2>'+questions[0][0]+'</h2>'+questions[0][1].map((x,i)=>'<button class="answer" onclick="answer('+i+')">'+x+'</button>').join('')+'</div><div class="flip-face flip-reveal paper"><small>THE MEMORY BEHIND IT</small><div id="quiz-photo"></div><h2>有被恶心到</h2><p id="feedback"></p><button class="action" onclick="unlockEnding()">Continue</button></div></div></div>'+back()}function answer(i){document.querySelectorAll('.answer').forEach(b=>b.disabled=true);let d=document.querySelector('#quiz-photo');let m=items.find(x=>x.id==='fc-p20');let src=m&&(m.src||m.thumb);if(src){let img=document.createElement('img');img.src=src;img.alt='Original IG Notes memory';d.append(img)}else{d.textContent='Original answer photo pending';d.className='quiz-placeholder'}document.querySelector('#feedback').textContent=i===0?'Correct!':'Now you remember!';document.querySelector('#flip-card').classList.add('flipped')}function unlockEnding(){unlocked=true;localStorage.setItem('fc-simple-'+who,'yes');app.innerHTML=title('A secret awaits')+'<button onclick="ending()" style="width:140px">'+star+'</button><p>Touch the hidden star</p>'+back()}function ending(){app.innerHTML=title('Est. Forever')+stars(true)+'<p>Of all the stars in the universe,<br>I’m glad our paths crossed.<br>Different dreams, different journeys,<br>but always under the same sky.</p><h2 style="font-weight:400">The Forever Club — Est. Forever.</h2>'+back()}
