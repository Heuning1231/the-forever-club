<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#21142d">
  <title>Memory Waterfall · The Forever Club</title>
  <link rel="stylesheet" href="./waterfall-preview/preview.css">
</head>
<body>
  <main class="waterfall">
    <canvas id="waterfall-canvas" aria-label="Polaroids falling through a lavender cloud canyon"></canvas>
    <header>
      <p>The Forever Club</p>
      <h1>Memory <em>Waterfall</em></h1>
    </header>
    <p id="render-status" role="status">Opening the archive…</p>
    <footer>
      <p id="gesture">Drag to drift · Tap to open</p>
      <div class="controls" hidden>
        <button id="motion-toggle" type="button">Pause flow</button>
        <button id="cinematic" type="button" aria-pressed="false">Cinematic</button>
      </div>
    </footer>
    <section id="fallback" aria-label="Archive preview" hidden></section>
    <dialog id="archive-viewer" aria-label="Memory viewer">
      <form method="dialog"><button type="submit" autofocus>Close</button></form>
      <figure id="archive-media"></figure>
    </dialog>
  </main>
  <script type="module" src="./waterfall-preview/waterfall.bundle.js"></script>
</body>
</html>
