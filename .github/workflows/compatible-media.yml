name: Prepare compatible graduation media
on:
  push:
    paths:
      - '.github/workflows/compatible-media.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick libheif-examples
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow pillow-heif
      - name: Convert assets and build manifest
        shell: python
        run: |
          import pathlib, subprocess, json, hashlib, urllib.parse, re
          from PIL import Image, ImageOps
          import pillow_heif
          pillow_heif.register_heif_opener()
          root=pathlib.Path('.')
          html=pathlib.Path('index.html')
          s=html.read_text()
          match=re.search(r'const orbitItems=(\[[^\n]*?\]);',s)
          items=json.loads(match.group(1))
          out=pathlib.Path('compatible')
          out.mkdir(exist_ok=True)
          def run(args):
              subprocess.run(args,check=True,stdout=subprocess.DEVNULL,stderr=None)
          for m in items:
              p=pathlib.Path(urllib.parse.unquote(m['src']))
              stem=hashlib.sha256(str(p).encode()).hexdigest()[:16]
              thumb=out/(stem+'-thumb.jpg')
              if m['type']=='photo':
                  full=out/(stem+'.jpg')
                  if p.suffix.lower() in ('.heic','.heif'):
                      temp=out/(stem+'-temp.jpg')
                      ImageOps.exif_transpose(Image.open(p)).convert('RGB').save(temp,quality=92)
                      source=temp
                  else:
                      source=p
                  run(['convert',str(source),'-auto-orient','-resize','1600x1600>','-strip','-quality','85',str(full)])
                  run(['convert',str(full),'-resize','320x320>','-quality','78',str(thumb)])
                  if source!=p: source.unlink()
                  m.update(src=str(full),thumb=str(thumb),format='jpg')
              else:
                  full=out/(stem+'.mp4')
                  run(['ffmpeg','-v','error','-y','-i',str(p),'-map','0:v:0','-map','0:a?','-vf','scale=720:720:force_original_aspect_ratio=decrease:force_divisible_by=2','-c:v','libx264','-preset','fast','-crf','25','-pix_fmt','yuv420p','-c:a','aac','-b:a','96k','-movflags','+faststart',str(full)])
                  if full.stat().st_size>25*1024*1024:
                      raise RuntimeError('Video exceeds hosting limit: '+str(p))
                  run(['ffmpeg','-v','error','-y','-i',str(full),'-frames:v','1','-vf','scale=320:320:force_original_aspect_ratio=decrease',str(thumb)])
                  m.update(src=str(full),thumb=str(thumb),format='mp4')
              assert full.stat().st_size and thumb.stat().st_size
          s=s[:match.start(1)]+json.dumps(items,separators=(',',':'))+s[match.end(1):]
          a=s.index('function preview(')
          b=s.index('function memories()',a)
          s=s[:a]+"""function preview(m,i){return '<span class="static-preview"><img src="'+m.thumb+'" alt="Memory '+(i+1)+'" decoding="async">'+(m.type==='video'?'<span class="static-play">▷</span>':'')+'</span>'}
          """+s[b:]
          s=s.replace('</style>','.static-preview{position:relative;display:block;width:100%;aspect-ratio:1;overflow:hidden;background:#342047}.static-preview img{display:block;width:100%!important;height:100%!important;object-fit:cover;opacity:1!important}.static-play{position:absolute;bottom:6px;right:6px;border:1px solid #e4c58e;border-radius:50%;background:#241334b0;color:#ffe6b5;width:27px;height:27px;display:grid;place-items:center}.river-gallery{perspective:none!important;mask-image:none!important;-webkit-mask-image:none!important}#orbitCards{transform-style:flat!important}</style>')
          html.write_text(s)
          print('Converted and verified',len(items),'assets and thumbnails')
      - name: Publish compatible assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compatible index.html
          git commit -m "Publish browser-compatible gallery assets"
          git push origin HEAD:main
